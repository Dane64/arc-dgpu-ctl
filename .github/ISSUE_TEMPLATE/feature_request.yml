name: Feature request
description: Suggest an improvement
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "What are you trying to do?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
  - type: checkboxes
    id: contract
    attributes:
      label: Impact
      options:
        - label: "This changes the CLI contract (commands, `state` output, exit codes, paths) that parent projects rely on"
