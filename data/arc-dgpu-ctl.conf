# /etc/arc-dgpu-ctl.conf - optional overrides for arc-dgpu-ctl
# Everything here is optional; leave commented to let the tool auto-detect.

# Discrete GPU VGA function. Auto-detected by Intel Arc Alchemist (DG2) PCI ID.
#DGPU_VGA=0000:03:00.0

# Discrete GPU HDA audio function. MUST be unbound before the VGA function,
# otherwise i915 leaks an audio power wakeref and the kernel WARNs on unbind.
# Auto-detected as the Intel HDA device behind the same root port as the GPU.
#DGPU_AUD=0000:04:00.0

# Preferred DRM driver for the dGPU. Leave unset to try i915 then xe.
#GPU_DRIVER=i915

# In-use check on `off`. Processes in this list (compared with /proc/<pid>/comm)
# may keep a dGPU DRM node open as long as they are idle on it: compositors,
# Xwayland, logind and PID 1 open every GPU for hotplug, which is not usage.
# Anything else blocks `off` once it has work or memory on the dGPU.
# Holders must also run from a system path (/usr, /bin, /sbin, /lib; not
# /usr/local), so a user process cannot exempt itself by its name.
#SESSION_HOLDERS="systemd systemd-logind plymouthd Xorg X Xwayland kwin_wayland kwin_wayland_wr kwin_x11 gnome-shell mutter sway Hyprland labwc weston cosmic-comp"

# A session holder with more than this many MiB on the dGPU is rendering there
# (dGPU set as primary in xorg.conf, ...) and blocks off. 0 = no limit.
#SESSION_MEM_MAX=128

# Seconds to watch the dGPU engine counters for activity before switching off.
#USAGE_SAMPLE=1

# Seconds `restore` (boot) waits for i915/xe to finish probing.
#RESTORE_WAIT=15

# 1 = refuse `off` while ANY process has a dGPU DRM node open (old behaviour).
#STRICT_IN_USE=0
